<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – Hervé MORATILLE</title>
    <link rel="stylesheet" href="../../assets/styles/contact.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="relative">
        <main class="max-w-3xl mx-auto mt-24 p-8 bg-white/80 backdrop-blur-md rounded-xl shadow-xl">

            <h1 class="text-3xl font-bold text-center text-blue-800 mb-6">
                Me contacter
            </h1>

            <p class="text-center text-gray-700 mb-8">
                Une question, un projet, une demande d'information ?
                N'hésitez pas à m'envoyer un message, je vous répondrai rapidement.
            </p>

            <form id="contact-form" action="https://formspree.io/f/mqppzklq" method="POST" class="space-y-6">

                <!-- Champ Nom -->
                <div>
                    <label class="block text-gray-800 font-medium mb-2">Nom</label>
                    <input type="text" name="nom" required class="w-full px-4 py-3 rounded-lg border border-gray-300 
                  focus:ring-2 focus:ring-blue-600 focus:outline-none shadow-sm" placeholder="Votre nom">
                </div>

                <!-- Champ Email -->
                <div>
                    <label class="block text-gray-800 font-medium mb-2">Email</label>
                    <input type="email" name="email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 
                  focus:ring-2 focus:ring-blue-600 focus:outline-none shadow-sm" placeholder="Votre email">
                </div>

                <!-- Champ Message -->
                <div>
                    <label class="block text-gray-800 font-medium mb-2">Message</label>
                    <textarea name="message" rows="6" required class="w-full px-4 py-3 rounded-lg border border-gray-300 
                     focus:ring-2 focus:ring-blue-600 focus:outline-none shadow-sm resize-none"
                        placeholder="Votre message..."></textarea>
                </div>

                <!-- Bouton Envoyer -->
                <div class="text-center">
                    <button type="submit" class="inline-flex items-center justify-center gap-3 bg-blue-700 text-white px-8 py-3 rounded-lg shadow 
             hover:-translate-y-1 hover:scale-105 hover:shadow-xl transition transform duration-200">
                        <span>Envoyer</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 translate-y-[1px]" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path
                                d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z">
                            </path>
                            <path d="m21.854 2.147-10.94 10.939"></path>
                        </svg>

                    </button>
                </div>

                <p id="form-error" class="text-center text-red-600 hidden">
                    Une erreur est survenue, veuillez réessayer.
                </p>

            </form>

        </main>

    </div>
    <script src="../../assets/scripts/menu.js"></script>
    <script>
        // Envoi en AJAX : la redirection personnalisée de Formspree est payante
        const form = document.getElementById('contact-form');
        const errorMsg = document.getElementById('form-error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { Accept: 'application/json' }
                });
                if (response.ok) {
                    window.location.href = 'merci.html';
                } else {
                    errorMsg.classList.remove('hidden');
                }
            } catch {
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
