<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation contact – Hervé MORATILLE</title>
    <link rel="stylesheet" href="../../assets/styles/contact.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <main class="max-w-xl mx-auto mt-24 p-8 bg-white/80 backdrop-blur-md rounded-xl shadow-xl text-center">

        <!-- Icône de confirmation -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 mx-auto mb-4 text-green-600" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>

        <h1 class="text-3xl font-bold text-blue-800 mb-4">Merci pour votre message !</h1>

        <p class="text-gray-700 mb-6">
            Votre message a bien été envoyé.<br>
            Je vous répondrai dans les plus brefs délais.
        </p>

        <a href="./contact.html" class="inline-flex items-center justify-center gap-2 bg-blue-700 text-white px-6 py-3 rounded-lg shadow 
            hover:-translate-y-1 hover:scale-105 hover:shadow-xl transition transform duration-200">

            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 translate-y-[1px]" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path d="m12 19-7-7 7-7"></path>
                <path d="M19 12H5"></path>
            </svg>

            <span>Retour au formulaire</span>
        </a>

    </main>

</body>

</html>
